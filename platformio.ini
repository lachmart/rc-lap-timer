; PlatformIO configuration
[platformio]
default_envs = esp32dev

; The board: ESP32 DevKit, 30 pins, CH9102 USB-serial
[env:esp32dev]
platform = espressif32 @ 8.0.0          ; pinned, a core update can't silently break the build
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600                   ; lower to 460800 if uploads break off
lib_deps =
    links2004/WebSockets @ 2.7.3
; the web page is embedded into the firmware at build time (symbols _binary_web_*_start)
board_build.embed_txtfiles =
    web/index.html
    web/style.css
    web/app.js
test_ignore = *                         ; unit tests run on the Mac only (env native)

; Unit tests on the Mac: pio test -e native
[env:native]
platform = native
test_build_src = yes
build_src_filter = -<*> +<laps.cpp> +<beam.cpp>
build_flags = -std=c++17
