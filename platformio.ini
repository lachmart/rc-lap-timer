; PlatformIO configuration
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    links2004/WebSockets@^2.6.1
; the web page is embedded into the firmware at build time (symbols _binary_web_*_start)
board_build.embed_txtfiles =
    web/index.html
    web/style.css
    web/app.js
