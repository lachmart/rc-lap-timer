; PlatformIO configuration
[platformio]
default_envs = esp32dev

; The board: ESP32 DevKit, 30 pins, CH9102 USB-serial
[env:esp32dev]
platform = espressif32 @ 8.0.0          ; pinned, a core update can't silently break the build
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600                   ; lower to 460800 if uploads break off
; 1.9 MB app instead of 1.3 MB (no SPIFFS needed); nvs stays at 0x9000, saved settings survive
board_build.partitions = min_spiffs.csv
lib_deps =
    links2004/WebSockets @ 2.7.3
; the web page is embedded into the firmware at build time (symbols _binary_web_*_start)
board_build.embed_txtfiles =
    web/index.html
    web/style.css
    web/app.js
    web/race.js
    web/sound.js
    web/wifi.js
test_ignore = *                         ; unit tests run on the Mac only (env native)

; Upload over Wi-Fi, no USB cable: laptop on RC_Lap_Timer, then  pio run -e ota -t upload
; On the home network instead:  pio run -e ota -t upload --upload-port laptimer.local
[env:ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = 192.168.4.1
upload_flags = --auth=laptimer               ; OTA_PASSWORD in src/config.h

; Unit tests on the Mac: pio test -e native
[env:native]
platform = native
test_build_src = yes
build_src_filter = -<*> +<laps.cpp> +<beam.cpp> +<nec.cpp> +<passes.cpp> +<blink.cpp> +<webjson.cpp> +<raceclock.cpp> +<zroundproto.cpp>
build_flags = -std=c++17
