; Transponder firmware for ATtiny202 (megaTinyCore). Separate PlatformIO project:
;   cd transponder
;   PLATFORMIO_BUILD_FLAGS="-DTRANSPONDER_ID=0x1001" pio run -t upload
; Give every car its own id (0x1000–0xFFFF). Programmer: CP2102 USB-serial + 4.7 kΩ (SerialUPDI),
; see README.md.
[env:attiny202]
platform = atmelmegaavr
board = ATtiny202
framework = arduino
; 10 MHz runs reliably from ~4.3 V, what a 78L05 gives on a 6 V receiver supply
board_build.f_cpu = 10000000L
upload_protocol = serialupdi
upload_speed = 115200
; macOS name of the CP2102; check with: ls /dev/cu.*
upload_port = /dev/cu.SLAB_USBtoUART
